<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">ENTITY — Intelligence Beyond Boundaries</title>
  <desc id="desc">A luminous geometric orbital emblem surrounding a glowing blue planet, above the ENTITY wordmark.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".38" stop-color="#b8d9ff"/><stop offset=".7" stop-color="#537da9"/><stop offset="1" stop-color="#eefaff"/></linearGradient>
    <radialGradient id="space"><stop stop-color="#102e5b"/><stop offset=".72" stop-color="#030b1b"/><stop offset="1" stop-color="#01040b"/></radialGradient>
    <radialGradient id="planet" cx=".35" cy=".28"><stop stop-color="#b9f4ff"/><stop offset=".25" stop-color="#278fff"/><stop offset=".7" stop-color="#0750a8"/><stop offset="1" stop-color="#02132e"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="900" rx="52" fill="url(#space)"/>
