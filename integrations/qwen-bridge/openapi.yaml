openapi: 3.1.0
info:
  title: ENTITY Qwen Inference Bridge
  version: 0.1.0
  description: >
    Restricted text-inference connector. It does not expose ENTITY files,
    memory, administration, device control, or arbitrary tools.
servers:
  - url: https://REPLACE-WITH-DEPLOYED-WORKER.workers.dev
paths:
  /v1/chat/completions:
    post:
      operationId: askQwen
      summary: Send a text conversation to the owner-approved Qwen3.5-9B model
      description: >
        Requires an ENTITY OIDC access token. The gateway validates the identity
        and checks the server-side ai_model resource policy before inference.
        Only plain-text messages are accepted. Tool execution is disabled.
      security:
        - EntityOAuth:
            - openid
            - profile
            - offline_access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [messages]
              properties:
                model:
                  type: string
                  enum: ["Qwen/Qwen3.5-9B"]
                messages:
                  type: array
                  minItems: 1
                  maxItems: 24
                  items:
                    type: object
                    additionalProperties: false
                    required: [role, content]
                    properties:
                      role:
                        type: string
                        enum: [system, user, assistant]
                      content:
                        type: string
                        maxLength: 64000
                max_tokens:
                  type: integer
                  minimum: 1
                  maximum: 2048
                temperature:
                  type: number
                  minimum: 0
                  maximum: 2
      responses:
        "200":
          description: Qwen completion
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  object:
                    type: string
                  created:
                    type: integer
                  model:
                    type: string
                  choices:
                    type: array
                    items:
                      type: object
                  usage:
                    type: [object, "null"]
        "400":
          description: Invalid or unsupported request
        "401":
          description: Missing or invalid identity token
        "403":
          description: ENTITY policy denied model access
        "503":
          description: Inference disabled or a required service is unavailable
        "502":
          description: Qwen provider returned an unsuccessful response
components:
  securitySchemes:
    EntityOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://REPLACE-WITH-ENTITY-OIDC-HOST/REPLACE-WITH-REALM/protocol/openid-connect/auth
          tokenUrl: https://REPLACE-WITH-ENTITY-OIDC-HOST/REPLACE-WITH-REALM/protocol/openid-connect/token
          scopes:
            openid: Authenticate the ENTITY user
            profile: Read basic identity claims
            offline_access: Allow provider-managed refresh where configured
