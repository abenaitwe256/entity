name: Auth service checks

on:
  pull_request:
    paths:
      - "backend/auth-service/**"
      - ".github/workflows/auth-service.yml"
  push:
    branches: ["main"]
    paths:
      - "backend/auth-service/**"
      - ".github/workflows/auth-service.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: entity
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d entity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ENTITY_OIDC_ISSUER: https://identity.test.invalid/
      ENTITY_OIDC_AUDIENCE: entity-api-tests
      ENTITY_OIDC_JWKS_URL: https://identity.test.invalid/.well-known/jwks.json
      ENTITY_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/entity
      ENTITY_ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/auth-service/pyproject.toml
      - name: Install service and test dependencies
        run: python -m pip install -e "backend/auth-service[test]"
      - name: Apply production migration path to the test database
        working-directory: backend/auth-service
        run: |
          python - <<'PY'
          import os
          import secrets

          os.environ["ENTITY_AUDIT_HMAC_KEY"] = secrets.token_urlsafe(48)
          from alembic import command
          from alembic.config import Config

          command.upgrade(Config("alembic.ini"), "head")
          PY
      - name: Prepare a PR #5 schema for upgrade coverage
        env:
          ENTITY_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/entity_legacy
        run: |
          createdb -h localhost -U postgres entity_legacy
          python backend/auth-service/tests/fixtures/create_pr5_schema.py
      - name: Upgrade PR #5 schema and verify preserved owner data
        working-directory: backend/auth-service
        env:
          ENTITY_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/entity_legacy
        run: python tests/fixtures/migrate_pr5_schema.py
      - name: Run complete auth-service test suite
        working-directory: backend/auth-service
        run: python -m pytest -q
